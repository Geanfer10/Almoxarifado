<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--INICIO-->
<title>Almoxarifado Goiás Verde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#F2F4F0; --surface:#FFFFFF; --ink:#1A2420; --ink-2:#51605A; --line:#DCE2DB;
  --shelf:#2F6B3C; --shelf-2:#3E8250; --shelf-ink:#FFFFFF; --wood:#7A5B3E;
  --label:#FFFFFF; --label-ink:#141A17; --accent:#1E9350; --accent-soft:#E3F2E8;
  --red:#C8372D; --amber:#C57F00; --blue:#2E6FD9; --muted-bg:#EAEEE8;
  --shadow:0 1px 2px rgba(20,40,28,.08),0 2px 8px rgba(20,40,28,.06);
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --sans:"Barlow",system-ui,"Segoe UI",Arial,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111714; --surface:#19211D; --ink:#E6ECE8; --ink-2:#9AA8A1; --line:#2A3530;
    --shelf:#24512F; --shelf-2:#2F6A3D; --label:#F4F6F2; --label-ink:#141A17;
    --accent:#45B874; --accent-soft:#1D3526; --muted-bg:#202A25;
    --red:#E5574C; --amber:#E0A030; --blue:#5B92EA;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111714; --surface:#19211D; --ink:#E6ECE8; --ink-2:#9AA8A1; --line:#2A3530;
  --shelf:#24512F; --shelf-2:#2F6A3D; --label:#F4F6F2; --label-ink:#141A17;
  --accent:#45B874; --accent-soft:#1D3526; --muted-bg:#202A25;
  --red:#E5574C; --amber:#E0A030; --blue:#5B92EA;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Cabeçalho */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--shelf);color:var(--shelf-ink);
  display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 20px}
.marca{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.marca b{font:700 24px/1 var(--cond);letter-spacing:.02em;text-transform:uppercase}
.marca span{font-size:12.5px;opacity:.8}
.busca{flex:1 1 320px;max-width:520px;position:relative}
.busca input{width:100%;border:0;border-radius:6px;padding:10px 12px 10px 36px;font:500 15px var(--sans);
  background:var(--label);color:var(--label-ink)}
.busca svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#5b6b63}
.kpis{display:flex;gap:18px;font-size:12px;opacity:.95}
.kpis div{display:flex;flex-direction:column}
.kpis b{font:700 18px/1.1 var(--mono);font-variant-numeric:tabular-nums}

.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:0;min-height:calc(100% - 70px)}
/* Mapa de rua */
.mapa{border-right:1px solid var(--line);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:18px;
  position:sticky;top:70px;align-self:start;max-height:calc(100vh - 70px);overflow:auto}
.grupo h3{margin:0 0 8px;font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.rua{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.est{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 4px 5px;cursor:pointer;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:1px}
.est b{font:700 22px/1 var(--cond)}
.est small{font:500 10.5px var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.est:hover{border-color:var(--accent)}
.est[aria-pressed="true"]{background:var(--shelf);border-color:var(--shelf);color:var(--shelf-ink)}
.est[aria-pressed="true"] small{color:var(--shelf-ink);opacity:.85}
.est.largo{grid-column:span 2}
.legenda{font-size:12.5px;color:var(--ink-2);line-height:1.5;border-top:1px solid var(--line);padding-top:12px}
.legenda code{font:600 12px var(--mono);color:var(--ink);background:var(--muted-bg);padding:1px 4px;border-radius:3px}

/* Área principal */
.principal{padding:20px 24px 48px;display:flex;flex-direction:column;gap:18px;min-width:0}
.cab-est{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.placa{background:var(--label);color:var(--label-ink);border:3px solid var(--shelf);border-radius:6px;padding:8px 16px 10px;box-shadow:var(--shadow)}
.placa small{display:block;font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#C8372D}
.placa b{font:700 34px/1 var(--cond);text-transform:uppercase}
.placa p{margin:4px 0 0;font:600 14px var(--sans);text-transform:uppercase;letter-spacing:.02em}
.foto-est{width:64px;height:84px;border-radius:6px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in}
.resumo-est{color:var(--ink-2);font-size:14px;display:flex;flex-direction:column;gap:2px}
.resumo-est b{color:var(--ink);font-variant-numeric:tabular-nums}
.filtros{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip span{font-family:var(--mono);font-size:11.5px;opacity:.75;margin-left:4px}
.aviso{font-size:13px;color:var(--ink-2);background:var(--muted-bg);border-radius:6px;padding:8px 12px}
.aviso b{color:var(--ink)}

/* Níveis como a rua real: tábua de madeira + trilho verde com etiquetas */
.niveis{display:flex;flex-direction:column;gap:22px}
.nivel{border-radius:8px;overflow:hidden;box-shadow:var(--shadow);background:var(--surface)}
.nivel-cab{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--shelf);color:var(--shelf-ink)}
.nivel-cab .tag{background:var(--label);color:var(--label-ink);font:700 14px var(--mono);padding:2px 8px;border-radius:3px}
.nivel-cab span{font-size:13px;opacity:.9}
.nivel-cab .qt{margin-left:auto;font:600 12.5px var(--mono);opacity:.9}
.trilho{background:linear-gradient(var(--shelf-2),var(--shelf));padding:10px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.etq{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start;text-align:left;
  background:var(--label);color:var(--label-ink);border:0;border-radius:4px;padding:7px;cursor:pointer;
  box-shadow:0 1px 0 rgba(0,0,0,.18);transition:transform .12s}
.etq:hover{transform:translateY(-2px)}
.etq.destaque{outline:3px solid #F2B705;outline-offset:1px}
.thumb{width:64px;height:64px;border-radius:3px;background:#E9ECE7;display:grid;place-items:center;overflow:hidden;color:#8A968F}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:22px;height:22px}
.etq .cod{font:700 16px/1.1 var(--mono);display:flex;align-items:center;gap:6px}
.etq .desc{font:600 12px/1.25 var(--sans);text-transform:uppercase;margin:3px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.etq .meta{font:500 11px/1.3 var(--mono);color:#4A5550;display:flex;flex-wrap:wrap;gap:2px 10px;font-variant-numeric:tabular-nums}
.st{font:700 10px var(--sans);letter-spacing:.04em;padding:1px 6px;border-radius:3px;color:#fff;text-transform:uppercase}
.st.repor{background:var(--red)} .st.atencao{background:var(--amber)} .st.ok{background:#1E9350} .st.acima{background:var(--blue)}
.vazio{color:var(--ink-2);padding:30px;text-align:center;background:var(--surface);border-radius:8px}

/* Resultados da busca */
.res-lista{display:flex;flex-direction:column;gap:6px}
.res{display:grid;grid-template-columns:48px 90px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-radius:6px;padding:6px 12px 6px 6px;cursor:pointer;text-align:left}
.res:hover{border-color:var(--accent)}
.res .thumb{width:48px;height:48px}
.res .cod{font:700 14px var(--mono)}
.res .desc{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .loc{font:700 13px var(--mono);background:var(--shelf);color:var(--shelf-ink);padding:3px 8px;border-radius:4px}

/* Ficha do item */
.fundo{position:fixed;inset:0;background:rgba(10,20,15,.55);z-index:50;display:flex;justify-content:flex-end}
.ficha{width:min(460px,100%);height:100%;background:var(--surface);overflow:auto;display:flex;flex-direction:column}
.ficha-foto{background:#1b221e;height:46vh;min-height:220px;flex:none;max-width:100%;display:grid;place-items:center;color:#AEB9B3;text-align:center;font-size:13px;position:relative;overflow:hidden}
.ficha-foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ficha-foto a{position:absolute;inset:0;cursor:zoom-in}
.dica-foto{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px 8px;border-radius:4px;pointer-events:none}
.ficha-foto code{font:600 12px var(--mono);background:rgba(255,255,255,.1);padding:2px 6px;border-radius:3px;color:#fff}
.fechar{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:18px}
.ficha-corpo{padding:18px 20px 24px;display:flex;flex-direction:column;gap:14px}
.ficha-cod{display:flex;align-items:center;gap:10px}
.ficha-cod b{font:700 28px/1 var(--mono)}
.copiar{border:1px solid var(--line);background:var(--bg);border-radius:4px;font-size:12px;padding:3px 8px;cursor:pointer}
.ficha h2{margin:0;font:600 18px/1.3 var(--sans);text-transform:uppercase;text-wrap:balance}
.dados{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.dados div{background:var(--surface);padding:8px 12px}
.dados dt{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.dados dd{margin:2px 0 0;font:700 17px var(--mono);font-variant-numeric:tabular-nums}
.dados .cheio{grid-column:1/-1}
.faixa{display:flex;flex-direction:column;gap:6px}
.faixa-barra{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--red) 0 33%,#1E9350 33% 80%,var(--blue) 80%)}
.faixa-txt{display:flex;justify-content:space-between;font:500 12px var(--mono);color:var(--ink-2)}
.nav-ficha{display:flex;gap:8px}
.nav-ficha button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px;cursor:pointer;font-size:13px}
.nav-ficha button:disabled{opacity:.4;cursor:default}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .mapa{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  .estantes{grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}
  .kpis{display:none}
  .principal{padding:16px 16px 40px}
  .res{grid-template-columns:48px minmax(0,1fr) auto}
  .res .cod{grid-column:2}
  .res .desc{grid-column:2;grid-row:2}
  .res .loc{grid-row:1/3;grid-column:3}
  .res .thumb{grid-row:1/3}
}
@media (prefers-reduced-motion:reduce){.etq{transition:none}.etq:hover{transform:none}}
</style>
</head>
<body>
<header class="topo">
  <div class="marca"><b>Almoxarifado</b><span id="atualizado">Goiás Verde · Controle de estoque por prateleira</span></div>
  <label class="busca">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="busca" type="search" placeholder="Buscar por código, descrição ou local (ex.: 36605, rolamento, K03)" autocomplete="off">
  </label>
  <div class="kpis" id="kpis"></div>
</header>

<div class="layout">
  <nav class="mapa" id="mapa" aria-label="Estantes"></nav>
  <main class="principal" id="principal"></main>
</div>

<div class="fundo" id="fundo" hidden></div>

<script src="dados.js"></script>
<script>
// Nomes das estantes (placas penduradas). Complete conforme o almoxarifado.
const NOMES_ESTANTE = {
  B: "Rolamentos e mancais",
  C: "Material de consumo",
  "2P": "2º piso",
  EXT: "Área externa"
};

const DADOS = window.ESTOQUE || {itens:[]};
const ITENS = DADOS.itens;
// Fotos das prateleiras: vêm da pasta Fotos\Estantes (ex.: B.jpg)
const FOTOS_ESTANTE = {};
for (const [k, v] of Object.entries(DADOS.estantes || {})) FOTOS_ESTANTE[k] = `fotos/estantes/${k}.jpg?v=${v}`;
if (DADOS.gerado) document.getElementById("atualizado").textContent = `Goiás Verde · Dados atualizados em ${DADOS.gerado}`;
const IC_CAMERA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 8h3l2-3h8l2 3h3v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>';

// Local: "K03-0006" -> estante K, nível K03, posição 6 | "2P1-0004" -> estante 2P, nível 2P1
function lerLocal(l){
  const [pre, pos] = l.split("-");
  let est = pre, nivel = pre;
  let m = /^([A-Z])(\d{2})$/.exec(pre);
  if (m) est = m[1];
  else if (/^2P\d+$/.test(pre)) est = "2P";
  return {est, nivel, pos: parseInt(pos, 10) || 0};
}
ITENS.forEach(i => Object.assign(i, lerLocal(i.l)));

function status(i){
  if (i.s == null || i.mn == null) return null;
  if (i.s < i.mn) return "repor";
  if (i.s <= i.mn * 1.2) return "atencao";
  if (i.mx && i.s > i.mx) return "acima";
  return "ok";
}
const ROT_ST = {repor:"Repor", atencao:"Atenção", ok:"Normal", acima:"Acima do máx."};
const temSaldo = ITENS.some(i => i.s != null);

// Agrupa por estante e nível
const EST = new Map();
for (const i of ITENS){
  if (!EST.has(i.est)) EST.set(i.est, new Map());
  const n = EST.get(i.est);
  if (!n.has(i.nivel)) n.set(i.nivel, []);
  n.get(i.nivel).push(i);
}
for (const n of EST.values()) for (const arr of n.values()) arr.sort((a,b) => a.pos - b.pos);

const fmt = n => n == null ? "—" : n.toLocaleString("pt-BR");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const foto = i => i.f ? `fotos/${i.c}.jpg?v=${i.f}` : null;
function thumb(i){
  return `<span class="thumb">${i.f ? `<img src="${foto(i)}" alt="" loading="lazy">` : IC_CAMERA}</span>`;
}
function catPrincipal(niveis){
  const c = {};
  for (const arr of niveis.values()) for (const i of arr) c[i.cat] = (c[i.cat]||0) + 1;
  return Object.entries(c).sort((a,b) => b[1]-a[1])[0]?.[0] || "";
}
const cap = s => s.charAt(0) + s.slice(1).toLowerCase();

// Estado
let estAtual = null, catFiltro = null, soFoto = false, busca = "", destaque = null;

// KPIs
document.getElementById("kpis").innerHTML = [
  ["Itens", ITENS.length], ["Estantes", EST.size],
  ["Níveis", [...EST.values()].reduce((s,n)=>s+n.size,0)], ["Com foto", ITENS.filter(i=>i.f).length]
].map(([r,v]) => `<div><b>${fmt(v)}</b>${r}</div>`).join("");

// Mapa lateral
function desenharMapa(){
  const letras = [...EST.keys()].filter(k => /^[A-Z]$/.test(k)).sort();
  const outros = [...EST.keys()].filter(k => !/^[A-Z]$/.test(k)).sort();
  const botao = (k, largo) => {
    const qt = [...EST.get(k).values()].reduce((s,a)=>s+a.length,0);
    return `<button class="est${largo?" largo":""}" data-est="${k}" aria-pressed="${k===estAtual}" title="${esc(NOMES_ESTANTE[k] || cap(catPrincipal(EST.get(k))))}"><b>${k}</b><small>${qt}</small></button>`;
  };
  document.getElementById("mapa").innerHTML = `
    <div class="grupo"><h3>Térreo · Estantes</h3><div class="estantes">${letras.map(k=>botao(k)).join("")}</div></div>
    <div class="grupo"><h3>Outras áreas</h3><div class="estantes">${outros.map(k=>botao(k,true)).join("")}</div></div>
    <div class="legenda">Como ler o local:<br><code>K03-0006</code> = estante <b>K</b>, nível <b>03</b>, posição <b>6</b>.<br><code>2P1-0004</code> = <b>2º piso</b>, bloco <b>1</b>, posição <b>4</b>.</div>`;
}
document.getElementById("mapa").addEventListener("click", e => {
  const b = e.target.closest("[data-est]"); if (!b) return;
  busca = ""; document.getElementById("busca").value = "";
  abrirEstante(b.dataset.est);
});

function abrirEstante(k, codDestaque){
  estAtual = k; catFiltro = null; destaque = codDestaque || null;
  try { localStorage.setItem("almox-est", k); } catch(e){}
  history.replaceState(null, "", "#" + k);
  desenharMapa(); desenharEstante();
  if (codDestaque){
    const el = document.querySelector(`[data-cod="${codDestaque}"]`);
    if (el) el.scrollIntoView({block:"center", behavior:"smooth"});
  } else window.scrollTo({top:0});
}

function desenharEstante(){
  const niveis = EST.get(estAtual);
  const todos = [...niveis.values()].flat();
  const cats = {};
  todos.forEach(i => cats[i.cat] = (cats[i.cat]||0)+1);
  const nome = NOMES_ESTANTE[estAtual] || cap(catPrincipal(niveis));
  const titulo = /^[A-Z]$/.test(estAtual) ? `Prateleira ${estAtual}` : (NOMES_ESTANTE[estAtual] || estAtual);
  const fEst = FOTOS_ESTANTE[estAtual];
  const filtrar = i => (!catFiltro || i.cat === catFiltro) && (!soFoto || i.f);

  let html = `<section class="cab-est">
    <div class="placa"><small>Goiás Verde</small><b>${esc(titulo)}</b><p>${esc(/^[A-Z]$/.test(estAtual) ? nome : "")}</p></div>
    ${fEst ? `<img class="foto-est" src="${fEst}" alt="Foto da prateleira ${estAtual}" data-zoom="${fEst}">` : ""}
    <div class="resumo-est"><span><b>${fmt(todos.length)}</b> itens em <b>${niveis.size}</b> níveis</span>
    <span><b>${todos.filter(i=>i.f).length}</b> com foto</span></div>
  </section>
  <div class="filtros">
    <button class="chip" data-cat="" aria-pressed="${!catFiltro}">Todas<span>${todos.length}</span></button>
    ${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,n]) =>
      `<button class="chip" data-cat="${esc(c)}" aria-pressed="${c===catFiltro}">${esc(cap(c))}<span>${n}</span></button>`).join("")}
    <button class="chip" data-foto aria-pressed="${soFoto}">Só com foto</button>
  </div>`;
  if (!temSaldo) html += `<div class="aviso"><b>Saldo ainda não integrado.</b> Quando a planilha trouxer o saldo, cada etiqueta mostra se o item está abaixo do mínimo.</div>`;

  html += `<div class="niveis">`;
  const chaves = [...niveis.keys()].sort();
  let algum = false;
  for (const nv of chaves){
    const arr = niveis.get(nv).filter(filtrar);
    if (!arr.length) continue;
    algum = true;
    const rot = /^[A-Z]\d{2}$/.test(nv) ? `Nível ${nv.slice(1)}` : (/^2P/.test(nv) ? `Bloco ${nv.slice(2)}` : "");
    html += `<section class="nivel"><div class="nivel-cab"><span class="tag">${nv}</span><span>${rot}</span><span class="qt">${arr.length} ${arr.length>1?"itens":"item"}</span></div>
      <div class="trilho">${arr.map(etiqueta).join("")}</div></section>`;
  }
  if (!algum) html += `<div class="vazio">Nenhum item nesta prateleira com esse filtro.</div>`;
  html += `</div>`;
  document.getElementById("principal").innerHTML = html;
}

function etiqueta(i){
  const st = status(i);
  return `<button class="etq${destaque===i.c?" destaque":""}" data-cod="${i.c}">
    ${thumb(i)}
    <span><span class="cod">${i.c}${st?`<span class="st ${st}">${ROT_ST[st]}</span>`:""}</span>
    <span class="desc">${esc(i.d)}</span>
    <span class="meta"><span>${i.l}</span><span>${i.u}</span><span>MÍN ${fmt(i.mn)} · MÁX ${fmt(i.mx)}</span></span></span>
  </button>`;
}

// Busca
function normal(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase(); }
ITENS.forEach(i => i._b = normal(`${i.c} ${i.d} ${i.l} ${i.cat}`));
function desenharBusca(){
  const termos = normal(busca).split(/\s+/).filter(Boolean);
  const achados = ITENS.filter(i => termos.every(t => i._b.includes(t)));
  const lim = achados.slice(0, 200);
  document.getElementById("principal").innerHTML = `
    <div class="aviso"><b>${fmt(achados.length)}</b> ${achados.length===1?"item encontrado":"itens encontrados"} para “${esc(busca)}”${achados.length>200?" · mostrando os 200 primeiros":""}. Clique para ver na prateleira.</div>
    <div class="res-lista">${lim.map(i => `<button class="res" data-ir="${i.c}" data-est="${i.est}">
      ${thumb(i)}<span class="cod">${i.c}</span><span class="desc">${esc(i.d)}</span><span class="loc">${i.l}</span></button>`).join("")
      || `<div class="vazio">Nada encontrado. Tente só parte do código ou uma palavra da descrição.</div>`}</div>`;
}
let tBusca;
document.getElementById("busca").addEventListener("input", e => {
  clearTimeout(tBusca);
  tBusca = setTimeout(() => {
    busca = e.target.value.trim();
    if (busca.length >= 2) desenharBusca(); else if (!busca) desenharEstante();
  }, 150);
});

// Cliques na área principal
document.getElementById("principal").addEventListener("click", e => {
  const ir = e.target.closest("[data-ir]");
  if (ir){ const cod = ir.dataset.ir; busca=""; document.getElementById("busca").value="";
    abrirEstante(ir.dataset.est, cod); abrirFicha(cod); return; }
  const c = e.target.closest("[data-cat]");
  if (c){ catFiltro = c.dataset.cat || null; desenharEstante(); return; }
  if (e.target.closest("[data-foto]")){ soFoto = !soFoto; desenharEstante(); return; }
  const z = e.target.closest("[data-zoom]");
  if (z){ abrirZoom(z.dataset.zoom); return; }
  const et = e.target.closest(".etq");
  if (et) abrirFicha(et.dataset.cod);
});

// Ficha
const fundo = document.getElementById("fundo");
function abrirFicha(cod){
  const i = ITENS.find(x => x.c === cod); if (!i) return;
  const irmaos = EST.get(i.est).get(i.nivel);
  const idx = irmaos.indexOf(i);
  const st = status(i);
  let pctMin = 33;
  fundo.innerHTML = `<aside class="ficha" role="dialog" aria-label="Item ${i.c}">
    <div class="ficha-foto">${i.f ? `<a href="${foto(i)}" target="_blank" rel="noopener" aria-label="Abrir foto ampliada"><img src="${foto(i)}" alt="${esc(i.d)}"></a><span class="dica-foto">Clique na foto para ampliar</span>`
      : `<div>${IC_CAMERA.replace('<svg','<svg width="40" height="40"')}<p>Sem foto cadastrada.<br>Para incluir, salve a imagem como <code>fotos/${i.c}.jpg</code></p></div>`}
      <button class="fechar" data-fechar aria-label="Fechar">✕</button></div>
    <div class="ficha-corpo">
      <div class="ficha-cod"><b>${i.c}</b><button class="copiar" data-copiar="${i.c}">Copiar código</button>${st?`<span class="st ${st}">${ROT_ST[st]}</span>`:""}</div>
      <h2>${esc(i.d)}</h2>
      <dl class="dados">
        <div><dt>Local</dt><dd>${i.l}</dd></div>
        <div><dt>Medida</dt><dd>${esc(i.u)}</dd></div>
        <div><dt>Est. mínimo</dt><dd>${fmt(i.mn)}</dd></div>
        <div><dt>Est. máximo</dt><dd>${fmt(i.mx)}</dd></div>
        <div><dt>Saldo</dt><dd>${i.s==null?'<span style="font:500 14px var(--sans);color:var(--ink-2)">Sem informação</span>':fmt(i.s)}</dd></div>
        <div><dt>Categoria</dt><dd style="font:600 14px var(--sans)">${esc(cap(i.cat))}</dd></div>
      </dl>
      <div class="nav-ficha">
        <button data-vizinho="${irmaos[idx-1]?.c||""}" ${idx>0?"":"disabled"}>← ${irmaos[idx-1]?.l||"Início do nível"}</button>
        <button data-vizinho="${irmaos[idx+1]?.c||""}" ${idx<irmaos.length-1?"":"disabled"}>${irmaos[idx+1]?.l||"Fim do nível"} →</button>
      </div>
    </div></aside>`;
  fundo.hidden = false;
  fundo.querySelector(".fechar").focus();
  document.querySelectorAll(".etq.destaque").forEach(x=>x.classList.remove("destaque"));
  const el = document.querySelector(`.etq[data-cod="${cod}"]`);
  if (el) el.classList.add("destaque");
  destaque = cod;
}
function abrirZoom(src){
  fundo.innerHTML = `<aside class="ficha" role="dialog" aria-label="Foto"><div class="ficha-foto" style="height:100%"><img src="${src}" alt=""><button class="fechar" data-fechar aria-label="Fechar">✕</button></div></aside>`;
  fundo.hidden = false;
}
function fechar(){ fundo.hidden = true; fundo.innerHTML = ""; }
fundo.addEventListener("click", e => {
  if (e.target === fundo || e.target.closest("[data-fechar]")) return fechar();
  const v = e.target.closest("[data-vizinho]");
  if (v && v.dataset.vizinho){ abrirFicha(v.dataset.vizinho);
    document.querySelector(`.etq[data-cod="${v.dataset.vizinho}"]`)?.scrollIntoView({block:"nearest"}); }
  const cp = e.target.closest("[data-copiar]");
  if (cp){ const t = cp.dataset.copiar;
    const ok = () => cp.textContent = "Copiado";
    try { navigator.clipboard.writeText(t).then(ok, ok); } catch(err){ ok(); } }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !fundo.hidden) fechar(); });

// Início: estante do link (#K), a última aberta, ou a primeira com fotos
let inicial = location.hash.slice(1).toUpperCase();
if (!EST.has(inicial)) { try { inicial = localStorage.getItem("almox-est"); } catch(e){ inicial = null; } }
if (!EST.has(inicial)) inicial = (ITENS.find(i => i.f) || ITENS[0]).est;
abrirEstante(inicial);

// Verifica dados novos a cada 5 minutos e recarrega quando ninguém está usando a tela
let pendente = false;
function tentarRecarregar(){ if (fundo.hidden && !busca) location.reload(); }
setInterval(() => {
  if (pendente) return tentarRecarregar();
  const s = document.createElement("script");
  s.src = "dados.js?t=" + Date.now();
  s.onload = () => { if (window.ESTOQUE && window.ESTOQUE.gerado !== DADOS.gerado){ pendente = true; tentarRecarregar(); } s.remove(); };
  s.onerror = () => s.remove();
  document.body.appendChild(s);
}, 5 * 60 * 1000);
</script>
<!--FIM-->
</body>
